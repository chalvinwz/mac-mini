---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: datastores-allow-namespace-only
  namespace: planpal
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [postgres, redis, nats]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 6379 }
        - { protocol: TCP, port: 4222 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nats-allow-monitoring-probe
  namespace: planpal
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [nats]
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { protocol: TCP, port: 8222 }

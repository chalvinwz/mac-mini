---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: planpal
spec:
  selector: { app: web }
  ports:
    - { name: http, port: 3000, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: planpal
spec:
  replicas: 1
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      serviceAccountName: planpal
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: web
          image: registry.10-218-65-27.traefik.me/planpal-web:dev
          imagePullPolicy: Always
          ports:
            - { name: http, containerPort: 3000 }
          envFrom:
            - secretRef: { name: planpal-web-env }
          startupProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 20
            failureThreshold: 4
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 160Mi }
            limits: { memory: 640Mi }

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
  namespace: planpal
spec:
  hostnames: [planpal.10-218-65-27.traefik.me]
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  rules:
    - matches:
        - { path: { type: PathPrefix, value: / } }
      backendRefs:
        - { name: web, port: 3000 }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-worker
  namespace: planpal
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: notification-worker }
  template:
    metadata:
      labels: { app: notification-worker }
    spec:
      serviceAccountName: planpal
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: notification-worker
          image: registry.10-218-65-27.traefik.me/planpal-notification-worker:dev
          imagePullPolicy: Always
          envFrom:
            - secretRef: { name: planpal-env }
            - configMapRef: { name: planpal-config }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 512Mi }
      terminationGracePeriodSeconds: 60
